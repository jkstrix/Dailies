org.gradle.jvmargs=-Xmx3G

minecraft_version=26.3
neo_version=26.3.0.115

mod_version=1.4.0

# The video encoder packed into the jar (EXP-8): our own LGPL build of FFmpeg for every platform, made by
# tools/ffmpeg/build.sh or the "FFmpeg for Dailies" workflow, whose dailies-ffmpeg-jars download goes in
# tools/ffmpeg/out/jars. dailies.encoderSource=bytedeco packs the JavaCPP Presets' Windows-only build instead
dailies.encoderSource=dailies
# The JavaCPP Presets' build, used only with dailies.encoderSource=bytedeco
ffmpeg_version=8.1.2-1.5.14

