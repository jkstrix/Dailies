# When a release is published on GitHub, its jars go to Modrinth: Dailies itself, the Server Companion and each
# compat to its own project (.github/modrinth.json). The API jar stays on GitHub. Needs the repository secret
# MODRINTH_TOKEN. Run by hand for a release already out, to add what Modrinth is missing (or to see what it would do)
name: Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0+26.3"
        required: true
      dry_run:
        description: "Only say what would be published"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publish the release's jars to Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: bash .github/scripts/modrinth-publish.sh "$TAG"
