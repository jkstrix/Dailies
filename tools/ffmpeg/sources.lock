# The exact sources the encoder is built from (specification EXP-8). One per line: name|version|url|sha256
#
# Every download is checked against its sha256 before it is used, and the build stops on any difference.
# A line whose sha256 is "-" has not been pinned yet: run "./build.sh lock" once, on a machine you trust, to
# download each such source, print its sha256 and write it here. Commit the result; from then on the build is
# pinned. Changing a version means changing its url, setting its sha256 back to "-" and locking again.
#
# Licences (all allow an LGPL build with no GPL and no non-free parts):
#   ffmpeg            LGPL 2.1 or later, as configured here (no --enable-gpl, no --enable-nonfree, no --enable-version3)
#   zlib              zlib licence
#   opus              BSD 3-clause
#   libvpx            BSD 3-clause, with Google's patent grant
#   libaom            BSD 2-clause, with the Alliance for Open Media patent licence
#   svt-av1           BSD 3-clause clear, with the Alliance for Open Media patent licence
#   nv-codec-headers  MIT (headers only; the NVIDIA driver supplies the encoder at run time)
#   amf               MIT (headers only; the AMD driver supplies the encoder at run time)
#   libvpl            MIT (Intel's dispatcher; the Intel driver supplies the encoder at run time)
#   libva             MIT (Linux only, shipped as shared libraries beside ffmpeg; the drivers are the system's)
#
# Never added: x264, x265 (GPL), OpenH264 (its patent licence only covers Cisco's own binaries), fdk-aac (non-free).
