modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "dailies_aeronautics"
version = "${version}"
displayName = "Dailies Create Aeronautics Compat"
authors = "James Knight"
description = '''
Create Aeronautics' play screens and overlays in Dailies recordings, with those of Simulated Coasters: the altitude
sensor, the modulating linked receiver, the nameplate, the contraption diagram and the linked typewriter, the levers' and
steering wheel's readouts, the typewriter's binding, the physics staff's locks, the lines put above the hotbar, and the
coaster track's placement row, hints and handles, recorded and drawn again in playback. Does nothing unless Dailies and
those mods are installed.
'''
# Only the player's game has anything to do: a server never needs it, and a game with it joins a server without it
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "dailies_aeronautics.mixins.json"

[[dependencies.dailies_aeronautics]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.dailies_aeronautics]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

# All soft: the compat stands down without Dailies, and leaves out the part of each mod that is missing
[[dependencies.dailies_aeronautics]]
modId = "dailies"
type = "optional"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.dailies_aeronautics]]
modId = "simulated"
type = "optional"
versionRange = "[1.3.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.dailies_aeronautics]]
modId = "simulatedcoasters"
type = "optional"
versionRange = "[0.1.5,)"
ordering = "AFTER"
side = "BOTH"
