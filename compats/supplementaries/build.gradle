// The Supplementaries compat (specification CPT-10): a small mod of its own, dailies_supplementaries, that records the play
// screens and overlays of Supplementaries and Amendments (both on Moonlight) through Dailies' compat API, and draws them
// again in playback. Like the Create compat it has only a client half: everything it records is on the player's own
// screen. It loads and runs without Dailies or either mod, doing nothing: each is a soft dependency, only compiled
// against, and each mod's part is claimed only when that mod is loaded.
//
// Built with Dailies (gradlew build in the repository builds it too); the modded test loads its jar (installTestMods).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = '1.0.0'
group = 'comedymonkey.dailiescompat'

base {
    archivesName = 'dailies-compat-supplementaries-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // Supplementaries, Amendments and Moonlight as Modrinth publishes them: the same jars, byte for byte, as the ones in the
    // owner's pack
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    mods {
        dailies_supplementaries {
            sourceSet sourceSets.main
        }
    }
    // No runs: the compat is tried in game beside Dailies and the mods, in the modded test (its supplementaries group)
}

// The versions in the owner's pack and the modded test, by Modrinth's version ids: each version number (1.21.1-4.0.2,
// 1.21-2.2.7, 1.21.1-3.8.3) names a Fabric build too, so the id picks the NeoForge one
def supplementariesVersion = 'rWq0ko29'
def amendmentsVersion = 'w19mjFoT'
def moonlightVersion = 'yBea1yLM'

dependencies {
    // Dailies' compat API, as its API jar: only compiled against, never packed in, so the mod runs without Dailies
    compileOnly project(path: ':', configuration: 'dailiesApi')
    // Supplementaries 4.0.2, Amendments 2.2.7 and Moonlight 3.8.3, the library both are built on: the same, so the mod runs
    // without any of them
    compileOnly("maven.modrinth:supplementaries:${supplementariesVersion}") { transitive = false }
    compileOnly("maven.modrinth:amendments:${amendmentsVersion}") { transitive = false }
    compileOnly("maven.modrinth:moonlight:${moonlightVersion}") { transitive = false }

    // The states' unit tests need neither the game nor the mods: the states are plain bytes
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
