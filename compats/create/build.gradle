// The Create compat (specification CPT-6): a small mod of its own, dailies_create, that records Create's play screens and
// overlays through Dailies' compat API and draws them again in playback. It was started from the template (CPT-5) and
// has only a client half: everything it records is on the player's own screen, so it needs nothing from a server. It
// loads and runs without Dailies or Create, doing nothing: both are soft dependencies, only compiled against.
//
// Built with Dailies (gradlew build in the repository builds it too); the modded test loads its jar (installTestMods).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = '1.0.0'
group = 'comedymonkey.dailiescompat'

base {
    archivesName = 'dailies-compat-create-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // Create, Ponder (with Catnip in it) and Flywheel, as Create's own README names them
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
}

neoForge {
    version = project.neo_version

    mods {
        dailies_create {
            sourceSet sourceSets.main
        }
    }
    // No runs: the compat is tried in game beside Dailies and Create, in the modded test (its create group)
}

// Create 6.0.10, the version in the owner's pack and the modded test
def createVersion = '6.0.10-281'
def ponderVersion = '1.0.82+mc1.21.1'
def flywheelVersion = '1.0.6'

dependencies {
    // Dailies' compat API, as its API jar: only compiled against, never packed in, so the mod runs without Dailies
    compileOnly project(path: ':', configuration: 'dailiesApi')
    // Create and the libraries its classes are built on: the same, so the mod runs without Create. Registrate is left out
    // on purpose: the compat names Create's blocks and items by their ids, never through Create's registry entries
    compileOnly("com.simibubi.create:create-1.21.1:${createVersion}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponderVersion}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheelVersion}") { transitive = false }

    // The states' unit tests need neither the game nor Create: the states are plain bytes. JOML, the game's own matrices
    // at the version the game brings, for the test that a value box's place comes back whole
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
