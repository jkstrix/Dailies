pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

rootProject.name = 'dailies'

// The Dailies Companion in companion/ is a build of its own, with its own settings file, that also builds on its own.
// Included so Dailies can carry its jar inside its own (jar-in-jar): singleplayer then needs no separate companion
includeBuild('companion')

// Compats for other people's mods, each a mod of its own built with Dailies (specification CPT-5): the template that
// each is started from, Jade's and the rest of the pack's (compats:extras)
include 'compats:template'
include 'compats:jade'
include 'compats:extras'
// Left out on Minecraft 26.3: Create, Sable, Create Aeronautics and its add-ons, Create's other add-ons and Supplementaries
// have no release for it yet (checked on Modrinth, CurseForge and Create's maven, 22 Nov 2026). Their compats stay in
// compats/ as they were for 1.21.1 (built on the mc/1.21.1 branch), to be ported when their mods are:
// compats:create, compats:aeronautics, compats:createextras, compats:supplementaries
